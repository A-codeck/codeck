services:
  test_db:
    image: postgres:16
    environment:
      POSTGRES_USER: my_usr
      POSTGRES_PASSWORD: my_pwd
      POSTGRES_DB: codeck_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_usr -d codeck_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - TEST_DB_HOST=test_db
      - TEST_DB_PORT=5432
      - TEST_DB_USER=my_usr
      - TEST_DB_PASSWORD=my_pwd
      - TEST_DB_NAME=codeck_test
      - TEST_DB_SSLMODE=disable
    depends_on:
      test_db:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
